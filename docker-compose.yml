services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-habithop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habithop}
      POSTGRES_DB: ${POSTGRES_DB:-habithop}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Upstream's last community image is kept on Quay; Docker Hub no longer serves it.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  minio-init:
    image: pgsty/mc:RELEASE.2026-11-12T00-00-00Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${S3_BUCKET:-habithop-private}
    volumes:
      - ./docker/minio-cors.json:/cors.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1
      && mc ready local >/dev/null 2>&1; do sleep 2; done
      && mc mb --ignore-existing "local/$${MINIO_BUCKET}"
      && mc anonymous set none "local/$${MINIO_BUCKET}"
      && mc cors set "local/$${MINIO_BUCKET}" /cors.json
    restart: "no"

volumes:
  postgres_data:
  minio_data:
